# The `dsh` backend's agent preset: the my-workbench multi-agent setup for
# DeepSeek Harness (DSH) — one orchestrator persona plus one named delegation
# tool per specialist prompt. Installed by `my-workbench --dsh` as
# <DSH_HOME>/.agent-presets/my-workbench/agent.cordis.yml; DSH reads it when a
# session mounts the preset, so a new session is needed to pick it up.
#
# This file is assembled from agents/ source — never edit the installed copy:
#   a `prompt:<agent>` placeholder becomes agents/prompts/<agent>.md verbatim,
#   and the `slot:dispatch` placeholder inside the orchestrator prompt comes
#   from agents/backends/dsh/slots/dispatch.md, as for every other backend.
# `designer` is deliberately absent: every other backend disables it in favour
# of the design-only ui-designer.
#
# This is an AGENT-PLANE composition. The `subagents` registry, the sandbox and
# approval stack, persistence, and the model route stay in the HOST composition;
# this file contributes one agent's tools and prompt sections. A row that
# PUBLISHES a service must sit inside a group carrying an `isolate` realm (see
# the planning and compaction groups below) or the mount is rejected. A row that
# only registers tools or consumes host services must stay OUTSIDE such a realm,
# or it resolves a private instance this preset never populated.
#
# Deliberately omitted from the shipped `standard` preset: the anonymous
# `subagent`/`subagent_fork` tools and the `workflow`/`ralph` engines. Here every
# delegation names a specialist, mirroring the Task-with-subagent_type flow the
# prompts were written for. Copy those rows from the shipped composition if you
# want them back.

# ── identity ────────────────────────────────────────────────────────────────

# The orchestrator prompt is the persona: it owns planning, routing, and
# verification, and it must not implement serially. `{{model}}`/`{{cwd}}`
# resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |
      {{prompt:orchestrator}}

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# The shell registry and its executors stay in the HOST composition; one of
# these two rows is live per platform, and `shell-env` (DSH_WEB_URL and friends)
# reaches the model's shell from there.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they need
# no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# The task registry stays host-side; this row gives the agent the model-facing
# controls, which the orchestrator prompt relies on for tracking lanes.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature: an entry-local realm is the correct
# lifetime, not a workaround.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# shares this realm. `tokenMeter` stays on the HOST plane — the rows here resolve
# that one instance, since the browser reads its context-meter projection for
# every session.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation: the specialist roster ───────────────────────────────────────

# The `subagents` registry and its spawn backend stay in the HOST composition
# (the registry answers cross-session queries and a provider name registers
# once), so these rows only register tools and need no realm.
#
# Every row carries one specialist prompt as its child persona and restricts the
# child's tools the way that prompt does:
#   * read-only lanes lose `write`/`edit` (observer and improver also lose the
#     shell), so "READ-ONLY" is enforced, not merely requested;
#   * every lane loses all seven delegation tools, so a lane cannot spawn lanes.
#     When adding a delegation row, add its toolName to these deny lists too —
#     `tools.restrict()` rejects unknown names, so a stale list fails loudly.
# The shell name is platform-dependent, hence the `!!js` conditional: naming the
# tool this platform does not register would make the spawn itself fail.
#
# Model routing: lanes inherit the orchestrator's route by default. To pin a
# faster/cheaper route per lane, add to that row (the route must exist in this
# DSH profile):
#     agentOptions:
#       provider: <provider-id>
#       model: <model-id>
# Setting `modelSelectionSettings: true` instead exposes provider/model/
# reasoning_effort on every lane, readable from the host's subagent route
# preference, at the cost of a wider schema per tool.
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # Background-first (continuable) delegation: a call returns a durable child
    # id and the completion notice re-invokes the orchestrator. Pass
    # `run_in_background: false` for a lane whose result gates the next step.
    - id: subagent-explorer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_explorer
        backgroundMode: continuable
        persona: |
          {{prompt:explorer}}
        toolFilter:
          deny: !!js "['write', 'edit', 'subagent_librarian', 'subagent_oracle', 'subagent_ui_designer', 'subagent_fixer', 'subagent_observer', 'subagent_improver']"

    - id: subagent-librarian
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_librarian
        backgroundMode: continuable
        persona: |
          {{prompt:librarian}}
        toolFilter:
          deny: !!js "['write', 'edit', 'subagent_explorer', 'subagent_oracle', 'subagent_ui_designer', 'subagent_fixer', 'subagent_observer', 'subagent_improver']"

    - id: subagent-oracle
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_oracle
        backgroundMode: continuable
        persona: |
          {{prompt:oracle}}
        toolFilter:
          deny: !!js "['write', 'edit', 'subagent_explorer', 'subagent_librarian', 'subagent_ui_designer', 'subagent_fixer', 'subagent_observer', 'subagent_improver']"

    # ui-designer writes its own mockup/spec deliverables, so it keeps
    # write/edit; it still never touches app source (its prompt's job).
    - id: subagent-ui-designer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_ui_designer
        backgroundMode: continuable
        persona: |
          {{prompt:ui-designer}}
        toolFilter:
          deny: !!js "['subagent_explorer', 'subagent_librarian', 'subagent_oracle', 'subagent_fixer', 'subagent_observer', 'subagent_improver']"

    # fixer is the only lane that implements: full tools, still a leaf.
    - id: subagent-fixer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_fixer
        backgroundMode: continuable
        persona: |
          {{prompt:fixer}}
        toolFilter:
          deny: !!js "['subagent_explorer', 'subagent_librarian', 'subagent_oracle', 'subagent_ui_designer', 'subagent_observer', 'subagent_improver']"

    - id: subagent-observer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_observer
        backgroundMode: continuable
        persona: |
          {{prompt:observer}}
        toolFilter:
          deny: !!js "['write', 'edit', 'subagent_explorer', 'subagent_librarian', 'subagent_oracle', 'subagent_ui_designer', 'subagent_fixer', 'subagent_improver'].concat(process.platform === 'win32' ? ['pwsh'] : ['bash'])"

    - id: subagent-improver
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_improver
        backgroundMode: continuable
        persona: |
          {{prompt:improver}}
        toolFilter:
          deny: !!js "['write', 'edit', 'subagent_explorer', 'subagent_librarian', 'subagent_oracle', 'subagent_ui_designer', 'subagent_fixer', 'subagent_observer'].concat(process.platform === 'win32' ? ['pwsh'] : ['bash'])"

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# The orchestrator prompt's "Todo continuity" rule assumes a durable task list.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. librarian depends on it.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
